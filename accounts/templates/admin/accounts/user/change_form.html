{% extends "admin/change_form.html" %}
{% load static %}

{% block extrastyle %}
{{ block.super }}
<link rel="stylesheet" href="{% static 'accounts/admin.css' %}">
{% endblock %}

{% block object-tools-items %}
{{ block.super }}
<li>
    {% if ban_url %}<a class="ban-action" href="{{ ban_url }}">Ban user</a>
    {% else %}<button type="button" class="ban-action" disabled aria-disabled="true">Ban user</button>{% endif %}
</li>
<li>
    {% if lift_ban_url %}<a class="ban-action" href="{{ lift_ban_url }}">Lift ban</a>
    {% else %}<button type="button" class="ban-action" disabled aria-disabled="true">Lift ban</button>{% endif %}
</li>
{% endblock %}
